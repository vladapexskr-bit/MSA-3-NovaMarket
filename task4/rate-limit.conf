http {
    map $http_user_agent $device_type {
        default          "web";
        ~*mobile|iphone|android|blackberry|opera\smini|iemobile   "mobile";
    }

    limit_req_zone $binary_remote_addr zone=web_zone:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile_zone:10m rate=30r/s;

    map $device_type $limit_zone {
        web    web_zone;
        mobile mobile_zone;
    }

    server {
        listen 80;

        location /api/ {
            limit_req zone=$limit_zone burst=100 nodelay;
            proxy_pass http://backend;
        }
    }
}